services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabill_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-collabill_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?MINIO_KMS_SECRET_KEY must be configured}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-user}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-password}
      S3_BUCKET: ${S3_BUCKET:-my-buckets}
      S3_PROJECT_FILES_BUCKET: ${S3_PROJECT_FILES_BUCKET:-collabill-project-files}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\";
      if [ \"$S3_ACCESS_KEY\" != \"$MINIO_ROOT_USER\" ]; then
      mc admin user info myminio \"$S3_ACCESS_KEY\" >/dev/null 2>&1 || mc admin user add myminio \"$S3_ACCESS_KEY\" \"$S3_SECRET_KEY\";
      mc admin policy attach myminio readwrite --user \"$S3_ACCESS_KEY\";
      fi;
      mc mb --ignore-existing myminio/\"$S3_BUCKET\";
      mc anonymous set download myminio/\"$S3_BUCKET\";
      mc mb --ignore-existing myminio/\"$S3_PROJECT_FILES_BUCKET\";
      mc anonymous set none myminio/\"$S3_PROJECT_FILES_BUCKET\";
      mc encrypt set sse-s3 myminio/\"$S3_PROJECT_FILES_BUCKET\";
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
